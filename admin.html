<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOS Admin</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap wide"><header class="adminhead"><div><b>VOICE OF SERVICE</b><h1>Admin Review</h1></div><button id="logout" class="secondary">Log out</button></header>
<section id="login" class="card"><h2>Admin access</h2><p class="muted">Sign in to review submissions.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Sign in</button><div id="loginMsg"></div></section>
<section id="dashboard" hidden><div class="stats"><div><strong id="total">0</strong><span>Total</span></div><div><strong id="pending">0</strong><span>Pending</span></div><div><strong id="reviewed">0</strong><span>Reviewed</span></div><div><strong id="awards">0</strong><span>Awards</span></div></div><button id="refresh" class="secondary">Refresh</button><button id="export" class="secondary">Export CSV</button><div id="list"></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
